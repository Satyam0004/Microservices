spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/products, /api/products/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users, /api/users/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders, /api/orders/**, /api/cart, /api/cart/**
server:
  port: 8080