spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/products,/products/**
          filters:
            - RewritePath=/products(?<segment>/.*), /api/products${segment}

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users,/users/**
          filters:
            - RewritePath=/users(?<segment>/?.*), /api/users${segment}

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders,/orders/**,/cart,/cart/**
          filters:
            - RewritePath=/orders(?<orderSegment>/?.*), /api/orders${orderSegment}
            - RewritePath=/cart(?<cartSegment>/?.*), /api/cart${cartSegment}

        - id: eureka-server-ui
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/main
          filters:
            - SetPath=/
            - RemoveRequestHeader=X-Forwarded-Prefix

        - id: eureka-server-ui-redirect
          uri: no://op
          predicates:
            - Path=/eureka
          filters:
            - RedirectTo=302,/eureka/

        - id: eureka-server-double-eureka
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/eureka/**
          filters:
            - StripPrefix=1

        - id: eureka-server-assets
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**


server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

tracing:
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: http://localhost:9411/api/v2/spans

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      ecomBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 3
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based